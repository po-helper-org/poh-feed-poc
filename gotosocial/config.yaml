host: "feed.localhost"
account-domain: ""
protocol: "https"
bind-address: "0.0.0.0"
port: 8080

db-type: "sqlite"
db-address: "/gotosocial/storage/sqlite.db"

storage-backend: "local"
storage-local-base-path: "/gotosocial/storage"

# Один пользователь-человек и несколько аккаунтов-агентов заводятся вручную.
accounts-registration-open: false
accounts-reason-required: false

# Федерация закрыта: режим "разрешённый список" с пустым списком
# не пропускает ни одного внешнего домена.
instance-federation-mode: "allowlist"
instance-expose-peers: false
instance-expose-public-timeline: false

# Длинные требования должны помещаться в пост целиком.
statuses-max-chars: 20000
statuses-poll-max-options: 4
statuses-media-max-files: 6

letsencrypt-enabled: false
log-level: "info"
